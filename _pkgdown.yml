template:
  bootstrap: 5
  light-switch: no
  math-rendering: mathjax
  bslib:
    bootswatch: minty
    pkgdown-nav-height: 100px
  includes:
    in_header: |
       <!-- Global site tag (gtag.js) - Google Analytics -->
       <script async src="https://www.googletagmanager.com/gtag/js?id=G-LYPTX890W0" ></script>
       <script>
         window.dataLayer = window.dataLayer || [];
         function gtag(){dataLayer.push(arguments);}
         gtag('js', new Date());

         gtag('config', 'G-LYPTX890W0');
       </script>
       <!-- Google tag (gtag.js) -->
    after_body: >
      <script data-goatcounter="https://avial.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

deploy:
  install_metadata: yes

url: https://aravind-j.github.io/avial/

navbar:
  structure:
    left:
    - home
    - reference
    - articles
    right:
    - search
    - github
    - lightswitch
  components:
    home:
      icon: fa-home fa-lg
      text: Home
      href: index.html
    reference:
      icon: fa-code
      text: Reference
      href: reference/index.html
    tutorial:
      icon: far fa-file
      text: Tutorial
      href: articles/index.html
    github:
      icon: fab fa-github-alt
      text: Github
      href: https://github.com/aravind-j/avial

search:
  exclude: news/index.html

reference:
    - title: Helpers
      contents:
         - '`flatten.data.frame`'

    - title: Plotting helpers
      contents:
         - '`binw`'

    - title: Dendrogram helpers
      contents:
         - '`group_constrained_order`'
         - '`reorder_dend_by_groups`'

    - title: Wrappers and helpers for `ggplot2`
      contents:
         - '`freq_distribution`'
         - '`groupwise_bar`'
         - '`groupwise_histogram`'
         - '`groupwise_dumbell`'
         - '`uniform_barwidth_grid`'
         - '`remove_scales`'
         - '`dnorm_ggplot`'

    - title: Statistical functions
      contents:
         - '`pairwise.augmentedRCBD`'
         - '`mse.bartlett.test`'
         - '`summary_quant`'
         - '`summary_qual`'

    - title: Prepare input files
      contents:
         - '`prep_mstrat_input`'
         - '`prep_powercore_input`'

    - title: Prepare output files
      contents:
         - '`parse_mstrat_out`'
